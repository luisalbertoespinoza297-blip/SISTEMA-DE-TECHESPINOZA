<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | TECHESPINOZA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef3f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            width: 100%;
            max-width: 400px;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.12);
        }

        h1 {
            color: #123b68;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #667085;
            text-align: center;
            margin-bottom: 28px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #344054;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #1769aa;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #104c80;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #667085;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <main class="login-container">
        <h1>TECHESPINOZA</h1>
        <p class="subtitle">Sistema de inventario y control de equipos</p>

        <form method="POST" action="/login">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario"
                   placeholder="Ingresa tu usuario" required>

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena"
                   placeholder="Ingresa tu contraseña" required>

            <button type="submit">Iniciar sesión</button>
        </form>

        <p class="footer">© 2026 TECHESPINOZA</p>
    </main>

</body>
</html>
